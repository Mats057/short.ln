<!DOCTYPE html>
<main>
  <h1 class="title">Short.ln</h1>
  <select name="selectType" id="selectType" required [(ngModel)]="componentType">
    <option value="shortener">Shortener</option>
    <option value="stats">Statistics</option>
  </select>
  @if (componentType() == "shortener") {
  <app-shortener />
  } @else if (componentType() == "stats"){
  <app-statistics />
  }
</main>
